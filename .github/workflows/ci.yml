name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: ruff check app tests scripts

  model-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
      - run: pip install -r requirements-dev.txt
      - name: Download models and translate in both directions
        run: python -m scripts.smoke_models

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: coptic-translation-api:ci
      - name: Check Compose configuration
        run: cp .env.example .env && docker compose config --quiet
      - name: Check non-root model-cache volume permissions and app imports
        run: >-
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m
          --mount type=volume,source=coptic-hf-cache,target=/models
          --entrypoint python coptic-translation-api:ci -c
          "import os; from pathlib import Path; import app.main; assert os.geteuid() == 10001; p = Path('/models/hub/.permission-check'); p.parent.mkdir(parents=True, exist_ok=True); p.write_text('ok'); p.unlink()"
